<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative AI - Secure Login Portal</title>
    <style>
        :root {
            --bg-color: #0F0C20;
            --card-bg: rgba(30, 25, 56, 0.6);
            --primary: #4FD8EB;
            --accent: #D0BCFF;
            --text-color: #FFFFFF;
            --text-secondary: #B0AEC6;
            --error-color: #FFB4AB;
            --success-color: #B4FFB4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 10% 20%, rgba(79, 216, 235, 0.15) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(208, 188, 255, 0.15) 0%, transparent 40%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-color);
            overflow: hidden;
        }

        .login-container {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24.dp;
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(79, 216, 235, 0.2);
            border-color: rgba(79, 216, 235, 0.3);
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(15, 12, 32, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: var(--text-color);
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(79, 216, 235, 0.2);
            background: rgba(15, 12, 32, 0.95);
        }

        .btn-signin {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none;
            border-radius: 12px;
            color: #0F0C20;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(79, 216, 235, 0.3);
        }

        .btn-signin:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(208, 188, 255, 0.5);
            filter: brightness(1.1);
        }

        .status-message {
            margin-top: 24px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            display: none;
            text-align: center;
        }

        .status-success {
            display: block;
            background-color: rgba(180, 255, 180, 0.15);
            border: 1px solid rgba(180, 255, 180, 0.3);
            color: var(--success-color);
        }

        .status-error {
            display: block;
            background-color: rgba(255, 180, 171, 0.15);
            border: 1px solid rgba(255, 180, 171, 0.3);
            color: var(--error-color);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">CREATIVE AI</div>
        <div class="subtitle">Secure E2E Authentication Portal</div>
        
        <form id="login-form" onsubmit="event.preventDefault(); handleLogin();">
            <div class="input-group">
                <label for="username-input">Username or Email</label>
                <input type="text" id="username-input" placeholder="e.g. user@creativeai.app" autocomplete="off">
            </div>
            
            <div class="input-group">
                <label for="password-input">Password</label>
                <input type="password" id="password-input" placeholder="••••••••">
            </div>
            
            <button type="submit" id="signin-button" class="btn-signin">Sign In</button>
        </form>
        
        <div id="status-message" class="status-message"></div>
    </div>

    <script>
        function handleLogin() {
            const usernameInput = document.getElementById('username-input');
            const passwordInput = document.getElementById('password-input');
            const statusMsg = document.getElementById('status-message');
            
            const username = usernameInput.value;
            const password = passwordInput.value;
            
            statusMsg.className = 'status-message';
            statusMsg.style.display = '';

            // 1. Empty field checks
            if (!username.trim() || !password.trim()) {
                statusMsg.textContent = 'All fields are required.';
                statusMsg.classList.add('status-error');
                return;
            }

            // 2. SQL injection character filter
            const sqlPatterns = [/['"-\-\*#=;]/g, /UNION/i, /SELECT/i, /OR/i, /AND/i];
            const hasSqlChars = sqlPatterns.some(pattern => pattern.test(username)) && 
                               (username.includes("'") || username.includes("\"") || username.includes("or") || username.includes("--"));
            if (hasSqlChars) {
                statusMsg.textContent = 'Invalid characters in username.';
                statusMsg.classList.add('status-error');
                return;
            }

            // 3. XSS injection filter
            if (username.includes('<') || username.includes('>')) {
                statusMsg.textContent = 'Invalid characters in username.';
                statusMsg.classList.add('status-error');
                return;
            }

            // 4. Length constraints
            if (username.length < 3) {
                statusMsg.textContent = 'Username must be at least 3 characters.';
                statusMsg.classList.add('status-error');
                return;
            }
            if (password.length < 6) {
                statusMsg.textContent = 'Password must be at least 6 characters.';
                statusMsg.classList.add('status-error');
                return;
            }

            // 5. Check valid users
            // Valid pattern: user[1-150]@creativeai.app
            const validUserMatch = username.match(/^user(\d+)@creativeai\.app$/);
            if (validUserMatch) {
                const userNum = parseInt(validUserMatch[1], 10);
                if (userNum >= 1 && userNum <= 150) {
                    if (password === 'ValidPass123!') {
                        statusMsg.textContent = `Login successful for ${username}!`;
                        statusMsg.classList.add('status-success');
                    } else {
                        statusMsg.textContent = 'Invalid password. Access denied.';
                        statusMsg.classList.add('status-error');
                    }
                    return;
                }
            }

            // If username doesn't exist
            statusMsg.textContent = 'User does not exist.';
            statusMsg.classList.add('status-error');
        }
    </script>
</body>
</html>
