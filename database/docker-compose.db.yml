version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: creative_ai_postgres
    restart: always
    environment:
      POSTGRES_USER: creative_user
      POSTGRES_PASSWORD: creative_pass
      POSTGRES_DB: creative_ai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creative_user -d creative_ai_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
