name: Nexus AI QA & Security CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: ANDROID COMPILATION & UNIT TESTS
  # ---------------------------------------------------------------------------
  android-verification:
    name: 📱 Android Compilation & Unit Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Create local.properties & Setup Signing
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        mkdir -p ~/.android
        keytool -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
        cp ~/.android/debug.keystore ./debug.keystore

    - name: Build Debug Application APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Run Android JUnit Unit Tests
      run: ./gradlew testDebugUnitTest --no-daemon

    - name: Upload Android Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: android-unit-test-reports
        path: app/build/reports/tests/

  # ---------------------------------------------------------------------------
  # JOB 2: WEB E2E SELENIUM TESTS
  # ---------------------------------------------------------------------------
  web-e2e-tests:
    name: 🌐 Web Frontend E2E (Selenium)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies & Run Web E2E Tests
      run: |
        npm install --prefix selenium-tests
        node selenium-tests/tests/login-tests.js

    - name: Upload Web E2E Report
      uses: actions/upload-artifact@v4
      with:
        name: web-e2e-report
        path: selenium-tests/Test_Execution_Report.xlsx

  # ---------------------------------------------------------------------------
  # JOB 3: MOBILE APPIUM E2E TESTS
  # ---------------------------------------------------------------------------
  mobile-e2e-tests:
    name: 🤖 Mobile Application E2E (Appium)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies & Run Mobile E2E Tests
      run: |
        npm install --prefix appium-tests
        node appium-tests/tests/app-tests.js

    - name: Upload Mobile E2E Report
      uses: actions/upload-artifact@v4
      with:
        name: mobile-e2e-report
        path: appium-tests/App_Test_Execution_Report.xlsx

  # ---------------------------------------------------------------------------
  # JOB 4: BASELINE LOAD TESTS
  # ---------------------------------------------------------------------------
  load-tests:
    name: ⚡ Baseline Performance Load Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies & Run Load Tests
      run: |
        npm install --prefix selenium-tests
        node selenium-tests/load-test.js

    - name: Upload Load Test Report
      uses: actions/upload-artifact@v4
      with:
        name: load-test-report
        path: selenium-tests/Load_Test_Execution_Report.xlsx

  # ---------------------------------------------------------------------------
  # JOB 5: BACKEND SECURITY AUDIT (SAST)
  # ---------------------------------------------------------------------------
  security-sast-audit:
    name: 🔒 Backend Security Audit (SAST)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies & Run Security Audit
      run: |
        npm install --prefix selenium-tests
        node selenium-tests/generate-reports.js

    - name: Upload SAST Findings & Inventory
      uses: actions/upload-artifact@v4
      with:
        name: security-sast-report
        path: |
          Vulnerability Test Results/findings.xlsx
          Vulnerability Test Results/endpoint-inventory.xlsx
