name: Full E2E & Load Testing Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  android_verification:
    name: 📱 Android Compilation & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties & Setup Signing
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # Copy mock debug.keystore for signing configuration verification
          mkdir -p ~/.android
          keytool -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          cp ~/.android/debug.keystore ./debug.keystore

      - name: Build Debug Application APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Run Android JUnit Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload Android Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: app/build/reports/tests/

  e2e_and_load_verification:
    name: 🌐 Web E2E, Mobile Appium & Load Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup Node.js Environment for E2E and Load Testing
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Setup Python Environment for FastAPI backend
      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install Python dependencies and start backend in background
      - name: Start FastAPI Backend Server
        run: |
          pip install -r backend/requirements.txt
          pip install email-validator
          # Run backend in the background on port 8000
          PYTHONPATH=. python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 &
          # Wait for server to bind
          sleep 5

      # Run Web E2E (Selenium) Tests
      - name: Execute Web E2E Selenium Tests
        run: |
          cd selenium-tests
          npm install
          # Start headless Chrome browser checks
          node tests/login-tests.js

      # Run Mobile Appium Simulation Tests
      - name: Execute Appium Mobile E2E Simulation
        run: |
          cd appium-tests
          npm install
          node tests/app-tests.js

      # Run Baseline Load Testing
      - name: Execute Baseline HTTP Load Testing
        run: |
          cd selenium-tests
          # Runs baseline checks (100 VUs for 60s) and generates Load_Test_Execution_Report.xlsx
          node load-test.js

      # Archive & Upload All Excel Test Reports
      - name: Upload All Excel Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test-Execution-Excel-Reports
          path: |
            selenium-tests/Test_Execution_Report.xlsx
            appium-tests/App_Test_Execution_Report.xlsx
            selenium-tests/Load_Test_Execution_Report.xlsx
            Vulnerability Test Results/findings.xlsx
            Vulnerability Test Results/endpoint-inventory.xlsx
          if-no-files-found: warn
